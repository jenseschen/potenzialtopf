<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><title>Endlicher Potentialtopf</title><style>body{font-family:Arial;margin:16px}canvas{border:1px solid #444}label{margin-right:8px}.ctrl{background:#f3f3f3;padding:8px;margin-bottom:8px}</style></head><body><h2>Endlicher Potentialtopf</h2><div class="ctrl">V0 <input id="v0" type="range" min="20" max="200" value="80"><span id="v0t">80</span> <button id="pause">Pause</button> Geschwindigkeit <input id="speed" type="range" min="0" max="5" step="0.1" value="0.2"><span id="st">0.2×</span></div><div id="checks"></div><canvas id="cv" width="1300" height="820"></canvas><script>const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let V0=80,t=0,paused=false,speed=0.2,NMAX=12;let states=[],active=[];function bisect(f,a,b){let fa=f(a),fb=f(b);if(!isFinite(fa)||!isFinite(fb)||fa*fb>0)return null;for(let i=0;i<70;i++){let m=(a+b)/2,fm=f(m);if(fa*fm<=0){b=m;fb=fm}else{a=m;fa=fm}}return(a+b)/2}function psiRaw(s,x){let k=Math.sqrt(2*s.E),kap=Math.sqrt(2*(V0-s.E));if(x>=0&&x<=1){return s.par==='e'?Math.cos(k*(x-0.5)):Math.sin(k*(x-0.5));}const edgeVal=s.par==='e'?Math.cos(k*0.5):(x<0?-Math.sin(k*0.5):Math.sin(k*0.5));if(x<0)return edgeVal*Math.exp(kap*x);return edgeVal*Math.exp(-kap*(x-1));}function normalize(s){let sum=0,dx=0.0005;for(let x=-1;x<=2;x+=dx){let p=psiRaw(s,x);sum+=p*p*dx;}s.norm=1/Math.sqrt(sum);}function psi(s,x){return s.norm*psiRaw(s,x);}function solve(){states=[];let z0=Math.sqrt(V0/2);for(let m=0;m<20;m++){let a=m*Math.PI+1e-4,b=Math.min((m+0.5)*Math.PI-1e-4,z0-1e-4);if(a<b){let r=bisect(z=>z*Math.tan(z)-Math.sqrt(Math.max(0,z0*z0-z*z)),a,b);if(r)states.push({par:'e',E:2*r*r});}a=(m+0.5)*Math.PI+1e-4;b=Math.min((m+1)*Math.PI-1e-4,z0-1e-4);if(a<b){let r=bisect(z=>-z/Math.tan(z)-Math.sqrt(Math.max(0,z0*z0-z*z)),a,b);if(r)states.push({par:'o',E:2*r*r});}}states.sort((a,b)=>a.E-b.E);states=states.slice(0,NMAX);states.forEach(normalize);renderChecks();}function renderChecks(){const d=document.getElementById('checks');d.innerHTML='';states.forEach((s,i)=>{if(active[i]===undefined)active[i]=(i<2);let c=document.createElement('input');c.type='checkbox';c.checked=active[i];c.onchange=()=>active[i]=c.checked;let l=document.createElement('label');l.appendChild(c);l.append('E'+(i+1));d.appendChild(l);});}document.getElementById('v0').oninput=e=>{V0=+e.target.value;v0t.textContent=V0;solve();};document.getElementById('pause').onclick=()=>{paused=!paused;pause.textContent=paused?'Weiter':'Pause';};document.getElementById('speed').oninput=e=>{speed=+e.target.value;st.textContent=speed.toFixed(1)+'×';};solve();function draw(){ctx.clearRect(0,0,1300,820);const left=90,W=1100,axisY=180;ctx.strokeStyle='#0055ff';ctx.beginPath();ctx.moveTo(left,axisY);ctx.lineTo(left+W,axisY);ctx.stroke();for(let n=0;n<states.length;n++){if(!active[n])continue;let s=states[n];ctx.beginPath();ctx.strokeStyle='rgba(100,100,100,0.45)';for(let i=0;i<=W;i++){let x=-0.2+1.4*i/W;let y=axisY-28*psi(s,x)*Math.cos(s.E*t);if(i===0)ctx.moveTo(left+i,y);else ctx.lineTo(left+i,y);}ctx.stroke();}let rho=[],max=0,intg=0,xint=0;for(let i=0;i<=W;i++){let x=-0.2+1.4*i/W,re=0,im=0;states.forEach((s,n)=>{if(!active[n])return;let c=(n<2?1:0.4)*Math.exp(-0.3*n);let p=psi(s,x);re+=c*p*Math.cos(s.E*t);im-=c*p*Math.sin(s.E*t);});let r=re*re+im*im;rho.push(r);if(r>max)max=r;intg+=r;xint+=x*r;}let xexp=xint/intg;const top=360,bot=760;const insideL=left+(0.2/1.4)*W,insideR=left+(1.2/1.4)*W;ctx.strokeStyle='#800';ctx.lineWidth=8;let wh=Math.min(240,V0*2);ctx.beginPath();ctx.moveTo(insideL,top);ctx.lineTo(insideL,top-wh);ctx.moveTo(insideR,top);ctx.lineTo(insideR,top-wh);ctx.stroke();ctx.lineWidth=1;ctx.strokeStyle='black';ctx.strokeRect(left,top,W,bot-top);ctx.strokeStyle='red';ctx.lineWidth=4;ctx.beginPath();for(let i=0;i<=W;i++){let py=bot-280*rho[i]/max;if(i===0)ctx.moveTo(left+i,py);else ctx.lineTo(left+i,py);}ctx.stroke();let xp=(xexp+0.2)/1.4;let px=left+xp*W;let idx=Math.max(0,Math.min(W,Math.round(xp*W)));let py=bot-280*rho[idx]/max;ctx.fillStyle='black';ctx.beginPath();ctx.arc(px,py,7,0,6.28);ctx.fill();ctx.fillText('Start: E1 und E2 aktiv, v=0.2×',930,30);if(!paused)t+=0.008*speed;requestAnimationFrame(draw);}draw();</script></body></html>
